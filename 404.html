<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Eduardo Lorenzo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <script src="/assets/tema.js"></script>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; position: relative; overflow: hidden; }
    body::before { content: ""; position: absolute; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, var(--destaque), transparent 70%); filter: blur(90px); opacity: .35; top: -200px; left: 50%; transform: translateX(-50%); z-index: -1; }
    main { text-align: center; max-width: 520px; }
    .codigo { font-size: clamp(5rem, 22vw, 9rem); font-weight: 800; letter-spacing: -.05em; line-height: 1; margin: 0; background: linear-gradient(100deg, var(--destaque), var(--destaque-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 1.5rem; margin: 12px 0 8px; letter-spacing: -.02em; }
    p { color: var(--texto-2); margin: 0 0 28px; }
    a.btn { display: inline-block; padding: 11px 24px; border-radius: 999px; background: linear-gradient(120deg, var(--destaque), color-mix(in srgb, var(--destaque) 55%, var(--destaque-2))); color: #0a0d16; font-weight: 700; text-decoration: none; transition: transform .15s, filter .2s; }
    a.btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>Essa página não existe</h1>
    <p>O endereço pode ter mudado ou nunca ter existido. Que tal voltar para a vitrine e abrir uma das demos?</p>
    <a class="btn" href="/">&larr; Voltar para a vitrine</a>
  </main>
</body>
</html>
